<div class="login-page">
  <div class="background">
    <!-- Animation container -->
    <div class="animation-container">
      <!-- You can replace this with your animation element, e.g., Lottie or video -->
      <img src="assets/fondo-SIA-.png" alt="Background Image" class="background-image" />
      <div class="video-overlay"></div>
    </div>
  </div>
  <div class="login-box">
    <div class="logo-container">
      <img src="assets/logo_sm.png" alt="Logo" class="logo-image" />
    </div>
    <div class="welcome-text">
      <h1 class="sia-text">SIA</h1>
      <p>Bienvenido(a) ingrese con su documento.</p>
    </div>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="cedula">Documento</label>
        <input type="text" id="cedula" name="cedula" [(ngModel)]="cedula" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required />
      </div>
      <button type="submit" [disabled]="!loginForm.form.valid">Ingresar</button>
      <button type="button" class="forgot-password-btn" (click)="forgotPassword()">Olvidé mi contraseña</button>
    </form>
  </div>
</div>
