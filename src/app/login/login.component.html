<div class="login-page">
  <div class="background"></div>
  <div class="login-box">
    <div class="logo-container">
      <img src="assets/logo_sm.png" alt="Logo" class="logo-image" />
      <div class="welcome-text">
        <h1>Software de Investigación San Martín</h1>
        <p>Bienvenido(a) ingresa con tu correo institucional.</p>
      </div>
    </div>
    <form (ngSubmit)="onSubmit()" #loginForm="ngForm" class="login-form">
      <div class="form-group">
        <label for="cedula">Cédula</label>
        <input type="text" id="cedula" name="cedula" [(ngModel)]="cedula" required />
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" [(ngModel)]="password" required />
      </div>
      <button type="submit" [disabled]="!loginForm.form.valid">Ingresar</button>
      <button type="button" class="forgot-password-btn" (click)="forgotPassword()">Olvidé mi contraseña</button>
    </form>
  </div>
</div>
