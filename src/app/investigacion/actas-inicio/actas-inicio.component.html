<div class="container mt-5">
  <h2 class="mb-4">Generación y Aprobación del Acta de Inicio</h2>
  <form class="p-4 border rounded shadow-sm bg-white" (ngSubmit)="onSubmit()" #actaForm="ngForm">
    <!-- Convocatoria y Título -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="convocatoria" class="form-label fw-bold">Convocatoria</label>
        <input type="text" class="form-control" id="convocatoria" name="convocatoria" [(ngModel)]="acta.convocatoria" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="titulo" class="form-label fw-bold">Título</label>
        <input type="text" class="form-control" id="titulo" name="titulo" [(ngModel)]="acta.titulo" required>
      </div>
    </div>

    <!-- Código y Estado -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="codigo" class="form-label fw-bold">Código</label>
        <input type="text" class="form-control" id="codigo" name="codigo" [(ngModel)]="acta.codigo" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="estado" class="form-label fw-bold">Estado</label>
        <select class="form-select" id="estado" name="estado" [(ngModel)]="acta.estado" required>
          <option value="pendiente">Pendiente</option>
          <option value="aprobado">Aprobado</option>
          <option value="rechazado">Rechazado</option>
        </select>
      </div>
    </div>

    <!-- Duración prevista y Área del Conocimiento -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="duracion" class="form-label fw-bold">Duración Prevista (meses)</label>
        <input type="number" class="form-control" id="duracion" name="duracion" [(ngModel)]="acta.duracion" required>
      </div>
      <div class="col-md-6 mb-3">
        <label for="areaConocimiento" class="form-label fw-bold">Área del Conocimiento</label>
        <select class="form-select" id="areaConocimiento" name="areaConocimiento" [(ngModel)]="acta.areaConocimiento" required>
          <option value="">Seleccione un área</option>
          <option value="ciencias">Ciencias</option>
          <option value="ingenieria">Ingeniería</option>
          <option value="humanidades">Humanidades</option>
        </select>
      </div>
    </div>

    <!-- Características y Palabras Clave -->
    <div class="row">
      <div class="col-12 mb-3">
        <label for="caracteristicas" class="form-label fw-bold">Características</label>
        <textarea class="form-control" id="caracteristicas" name="caracteristicas" rows="3" [(ngModel)]="acta.caracteristicas" required></textarea>
      </div>
      <div class="col-12 mb-3">
        <label for="palabrasClave" class="form-label fw-bold">Palabras Clave</label>
        <input type="text" class="form-control" id="palabrasClave" name="palabrasClave" [(ngModel)]="acta.palabrasClave" required>
      </div>
    </div>

    <!-- Objetivo General y Específicos -->
    <div class="row">
      <div class="col-12 mb-3">
        <label for="objetivoGeneral" class="form-label fw-bold">Objetivo General</label>
        <textarea class="form-control" id="objetivoGeneral" name="objetivoGeneral" rows="3" [(ngModel)]="acta.objetivoGeneral" required></textarea>
      </div>
      <div class="col-12 mb-3">
        <label for="objetivosEspecificos" class="form-label fw-bold">Objetivos Específicos</label>
        <textarea class="form-control" id="objetivosEspecificos" name="objetivosEspecificos" rows="3" [(ngModel)]="acta.objetivosEspecificos" required></textarea>
      </div>
    </div>

    <!-- Resumen -->
    <div class="row">
      <div class="col-12 mb-3">
        <label for="resumen" class="form-label fw-bold">Resumen</label>
        <textarea class="form-control" id="resumen" name="resumen" rows="3" [(ngModel)]="acta.resumen" required></textarea>
      </div>
    </div>

    <!-- Unidades Académicas y Entidades Externas -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="unidadesAcademicas" class="form-label fw-bold">Unidades Académicas</label>
        <select class="form-select" id="unidadesAcademicas" name="unidadesAcademicas" [(ngModel)]="acta.unidadesAcademicas" required>
          <option value="">Seleccione una opción</option>
          <option value="ingenieria">Ingeniería</option>
          <option value="ciencias_sociales">Ciencias Sociales</option>
        </select>
      </div>
      <div class="col-md-6 mb-3">
        <label for="entidadesExternas" class="form-label fw-bold">Entidades Externas</label>
        <input type="text" class="form-control" id="entidadesExternas" name="entidadesExternas" [(ngModel)]="acta.entidadesExternas">
      </div>
    </div>

    <!-- Compromisos -->
    <div class="row">
      <div class="col-12 mb-3">
        <label for="compromisos" class="form-label fw-bold">Compromisos</label>
        <textarea class="form-control" id="compromisos" name="compromisos" rows="3" [(ngModel)]="acta.compromisos" required></textarea>
      </div>
    </div>

    <!-- Interdisciplinarios, Intergrupos y Área Estratégica -->
    <div class="row">
      <div class="col-md-4 mb-3">
        <label for="interdisciplinarios" class="form-label fw-bold">Interdisciplinarios</label>
        <select class="form-select" id="interdisciplinarios" name="interdisciplinarios" [(ngModel)]="acta.interdisciplinarios" required>
          <option value="si">Sí</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label for="intergrupos" class="form-label fw-bold">Intergrupos</label>
        <select class="form-select" id="intergrupos" name="intergrupos" [(ngModel)]="acta.intergrupos" required>
          <option value="si">Sí</option>
          <option value="no">No</option>
        </select>
      </div>
      <div class="col-md-4 mb-3">
        <label for="areaEstrategica" class="form-label fw-bold">Área Estratégica de Investigación - FUSM</label>
        <input type="text" class="form-control" id="areaEstrategica" name="areaEstrategica" [(ngModel)]="acta.areaEstrategica" placeholder="Ingrese el área estratégica">
      </div>
    </div>

    <!-- Observaciones -->
    <div class="row">
      <div class="col-12 mb-3">
        <label for="observaciones" class="form-label fw-bold">Observaciones</label>
        <textarea class="form-control" id="observaciones" name="observaciones" rows="3" [(ngModel)]="acta.observaciones" required></textarea>
      </div>
    </div>

    <!-- Fecha de aprobación automática -->
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="fechaAprobacion" class="form-label fw-bold">Fecha de Aprobación</label>
        <input type="text" class="form-control" id="fechaAprobacion" [value]="formattedFechaAprobacion" readonly>
      </div>
    </div>

    <!-- Botones -->
    <div class="row">
      <div class="col-6 text-center">
        <button type="button" class="btn btn-primary px-4 mt-3" (click)="cambiarEstado('pendiente')">Pendiente</button>
      </div>
      <div class="col-6 text-center">
        <button type="button" class="btn btn-success px-4 mt-3" (click)="cambiarEstado('aprobado')">Aprobado</button>
      </div>
      <div class="col-6 text-center">
        <button type="button" class="btn btn-danger px-4 mt-3" (click)="cambiarEstado('rechazado')">Rechazado</button>
      </div>
      <div class="col-12 text-center">
        <button type="submit" class="btn btn-secondary px-4 mt-3">Guardar Estado y Observación</button>
      </div>
    </div>
  </form>
</div>
